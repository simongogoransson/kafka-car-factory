server.port=${SERVER_PORT:8086}
# --- Kafka -------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
# --- Schema Registry ---------------------------------------------------------
app.schema-registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8080/apis/registry/v2}
# --- Producer behaviour ------------------------------------------------------
app.producer.emit-interval-ms=${EMIT_INTERVAL_MS:500}
# --- Actuator ----------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
# --- Logging -----------------------------------------------------------------
logging.level.com.factory=INFO
logging.level.org.apache.kafka=WARN
logging.level.io.confluent=WARN

