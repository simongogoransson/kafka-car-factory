server.port=${SERVER_PORT:8085}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/factory_analytics}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:factory}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:factory}

spring.thymeleaf.cache=false
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

cars.page-size=${CARS_PAGE_SIZE:100}
