apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apicurio-registry.fullname" . }}
  labels:
    {{- include "apicurio-registry.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "apicurio-registry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "apicurio-registry.selectorLabels" . | nindent 8 }}
    spec:
{{- if .Values.waitForKafka.enabled }}
      initContainers:
        - name: wait-for-kafka
          image: {{ .Values.waitForKafka.image }}
          env:
            - name: BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
          command:
            - bash
            - -c
            - |
              echo "Waiting for Kafka to be ready..."
              server="${BOOTSTRAP_SERVERS%%,*}"
              host="${server%%:*}"
              port="${server##*:}"
              until (echo > "/dev/tcp/${host}/${port}") >/dev/null 2>&1; do
                echo "Kafka is not ready yet. Waiting..."
                sleep 10
              done
              echo "Kafka bootstrap port is reachable at ${host}:${port}."
{{- end }}
      containers:
        - name: apicurio-registry
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: QUARKUS_HTTP_PORT
              value: {{ .Values.service.port | quote }}
            - name: QUARKUS_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: APICURIO_STORAGE_KIND
              value: {{ .Values.storage.kind | quote }}
            - name: APICURIO_KAFKASQL_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: APICURIO_KAFKASQL_TOPIC
              value: {{ .Values.kafka.storageTopic | quote }}
            - name: APICURIO_KAFKASQL_GROUP_ID
              value: {{ .Values.kafka.groupId | quote }}
{{- if .Values.extraEnv }}
{{- toYaml .Values.extraEnv | nindent 12 }}
{{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

