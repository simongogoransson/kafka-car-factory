# Default values for apicurio-registry
replicaCount: 1

image:
  repository: quay.io/apicurio/apicurio-registry
  tag: "3.2.1"
  pullPolicy: IfNotPresent

kafka:
  bootstrapServers: "factory-kafka-kafka-bootstrap.kafka-car-factory.svc.cluster.local:9092"
  storageTopic: "apicurio-registry-storage"
  storageTopicReplicationFactor: 3
  groupId: "apicurio-registry"

storage:
  kind: "kafkasql"

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    memory: 256Mi
    cpu: "100m"
  limits:
    memory: 512Mi
    cpu: "300m"

livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 20
  failureThreshold: 5

readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 5

logLevel: "INFO"

extraEnv:
  - name: APICURIO_REST_DELETION_ENABLED
    value: "true"

# Init container to wait for Kafka
waitForKafka:
  enabled: true
  image: quay.io/strimzi/kafka:0.51.0-kafka-4.1.0

