apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-dashboard
  namespace: kafka-car-factory
  labels:
    app: factory-dashboard
    app.kubernetes.io/part-of: kafka-car-factory-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: factory-dashboard
  template:
    metadata:
      labels:
        app: factory-dashboard
    spec:
      serviceAccountName: factory-dashboard
      containers:
        - name: factory-dashboard
          image: factory-dashboard
          ports:
            - name: http
              containerPort: 3000
            - name: ws
              containerPort: 3001
          env:
            - name: KAFKA_BROKERS
              value: factory-kafka-kafka-bootstrap.kafka-car-factory.svc.cluster.local:9092
            - name: USE_APICURIO_REGISTRY
              value: "true"
            - name: APICURIO_REGISTRY_URL
              value: http://apicurio-registry.kafka-car-factory.svc.cluster.local:8080
            - name: HTTP_PORT
              value: "3000"
            - name: WS_PORT
              value: "3001"
            - name: PRODUCER_CONTROL_URL
              value: http://factory-producer-control.kafka-car-factory.svc.cluster.local:3002
            - name: DASHBOARD_NAMESPACE
              value: kafka-car-factory
            - name: BROKER_NODEPOOL_NAME
              value: broker
            - name: BROKER_SCALE_UP_REPLICAS
              value: "4"
            - name: BROKER_SCALE_BASE_REPLICAS
              value: "3"
            - name: NODE_ENV
              value: production
          resources:
            requests:
              memory: 128Mi
              cpu: "100m"
            limits:
              memory: 256Mi
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
