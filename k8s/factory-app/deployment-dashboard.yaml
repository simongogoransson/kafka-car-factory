apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-dashboard
  namespace: kafka-car-factory
  labels:
    app: factory-dashboard
    app.kubernetes.io/part-of: kafka-car-factory-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: factory-dashboard
  template:
    metadata:
      labels:
        app: factory-dashboard
    spec:
      containers:
        - name: factory-dashboard
          image: factory-dashboard
          ports:
            - name: http
              containerPort: 3000
            - name: ws
              containerPort: 3001
          env:
            - name: KAFKA_BROKERS
              value: factory-kafka-kafka-bootstrap.kafka-car-factory.svc.cluster.local:9092
            - name: USE_SCHEMA_REGISTRY
              value: "false"
            # Schema Registry disabled - uncomment when available:
            # - name: SCHEMA_REGISTRY_URL
            #   value: http://schema-registry.kafka-car-factory.svc.cluster.local:8081
            - name: HTTP_PORT
              value: "3000"
            - name: WS_PORT
              value: "3001"
            - name: NODE_ENV
              value: production
          resources:
            requests:
              memory: 128Mi
              cpu: "100m"
            limits:
              memory: 256Mi
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
