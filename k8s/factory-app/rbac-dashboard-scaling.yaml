apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-dashboard
  namespace: kafka-car-factory
  labels:
    app.kubernetes.io/part-of: kafka-car-factory-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-dashboard-broker-scaling
  namespace: kafka-car-factory
  labels:
    app.kubernetes.io/part-of: kafka-car-factory-demo
rules:
  - apiGroups:
      - kafka.strimzi.io
    resources:
      - kafkanodepools
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-dashboard-broker-scaling
  namespace: kafka-car-factory
  labels:
    app.kubernetes.io/part-of: kafka-car-factory-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factory-dashboard-broker-scaling
subjects:
  - kind: ServiceAccount
    name: factory-dashboard
    namespace: kafka-car-factory
