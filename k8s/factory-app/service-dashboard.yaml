apiVersion: v1
kind: Service
metadata:
  name: factory-dashboard
  namespace: kafka-car-factory
  labels:
    app: factory-dashboard
    app.kubernetes.io/part-of: kafka-car-factory-demo
spec:
  selector:
    app: factory-dashboard
  ports:
    - name: http
      port: 3000
      targetPort: 3000
    - name: ws
      port: 3001
      targetPort: 3001
  type: ClusterIP
