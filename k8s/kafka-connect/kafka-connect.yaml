apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: factory-connect
  namespace: kafka-factory
  annotations:
    strimzi.io/use-connector-resources: "true"
  labels:
    app.kubernetes.io/part-of: kafka-factory-demo
spec:
  version: 4.1.0
  replicas: 1
  image: factory-connect
  bootstrapServers: factory-kafka-kafka-bootstrap.kafka-factory.svc.cluster.local:9092
  groupId: factory-connect-cluster
  configStorageTopic: factory-connect-configs
  offsetStorageTopic: factory-connect-offsets
  statusStorageTopic: factory-connect-status
  config:
    config.storage.replication.factor: 3
    offset.storage.replication.factor: 3
    status.storage.replication.factor: 3
    key.converter: org.apache.kafka.connect.storage.StringConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: false
  resources:
    requests:
      memory: 512Mi
      cpu: "200m"
    limits:
      memory: 1Gi
      cpu: "500m"
