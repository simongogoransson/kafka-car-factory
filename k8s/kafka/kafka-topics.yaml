# ─── assembly-line-events ─────────────────────────────────────────────────────
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: assembly-line-events
  namespace: kafka-car-factory
  labels:
    strimzi.io/cluster: factory-kafka
    app.kubernetes.io/part-of: kafka-car-factory-demo
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: 604800000   # 7 days
    cleanup.policy: delete
---
