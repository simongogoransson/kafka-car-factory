apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-data
  namespace: kafka-car-factory
  labels:
    app: neo4j
    app.kubernetes.io/part-of: kafka-car-factory-demo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  namespace: kafka-car-factory
  labels:
    app: neo4j
    app.kubernetes.io/part-of: kafka-car-factory-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 7474
      containers:
        - name: neo4j
          image: neo4j:5.26.3-community
          ports:
            - name: http
              containerPort: 7474
            - name: bolt
              containerPort: 7687
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: auth
            - name: NEO4J_server_memory_heap_initial__size
              value: 512m
            - name: NEO4J_server_memory_heap_max__size
              value: 512m
            - name: NEO4J_server_memory_pagecache_size
              value: 256m
            - name: NEO4J_server_default__listen__address
              value: 0.0.0.0
            - name: NEO4J_server_bolt_advertised__address
              value: neo4j.kafka-car-factory.svc.cluster.local:7687
            - name: NEO4J_server_http_advertised__address
              value: neo4j.kafka-car-factory.svc.cluster.local:7474
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 768Mi
              cpu: "250m"
            limits:
              memory: 1536Mi
              cpu: "750m"
          livenessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 60
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: bolt
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: neo4j-data
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: kafka-car-factory
  labels:
    app: neo4j
    app.kubernetes.io/part-of: kafka-car-factory-demo
spec:
  selector:
    app: neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
  type: ClusterIP