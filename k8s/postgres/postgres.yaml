apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: kafka-factory
  labels:
    app.kubernetes.io/part-of: kafka-factory-demo
data:
  01-init.sql: |
    CREATE TABLE IF NOT EXISTS vehicle_completed_events (
      id BIGSERIAL PRIMARY KEY,
      event_type TEXT NOT NULL,
      vin TEXT NOT NULL,
      model TEXT NOT NULL,
      color TEXT NOT NULL,
      production_time_min INTEGER NOT NULL,
      production_line TEXT NOT NULL,
      destination TEXT NOT NULL,
      delivery_date DATE NOT NULL,
      event_ts TIMESTAMPTZ NOT NULL,
      ingested_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: kafka-factory
  labels:
    app: postgres
    app.kubernetes.io/part-of: kafka-factory-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: factory_analytics
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: 128Mi
              cpu: "100m"
            limits:
              memory: 256Mi
              cpu: "300m"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kafka-factory
  labels:
    app: postgres
    app.kubernetes.io/part-of: kafka-factory-demo
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  type: ClusterIP
