apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: kafka-car-factory-demo

build:
  artifacts:
    - image: factory-producer
      context: apps/factory-producer
      docker:
        dockerfile: Dockerfile
    - image: factory-dashboard
      context: apps/factory-dashboard
      docker:
        dockerfile: Dockerfile
    - image: factory-delivered-cars
      context: apps/factory-delivered-cars
      docker:
        dockerfile: Dockerfile
    - image: factory-connect
      context: apps/factory-connect
      docker:
        dockerfile: Dockerfile
  local:
    push: false
    useDockerCLI: false   # uses DOCKER_HOST (Podman socket) directly
    useBuildkit: false

manifests:
  rawYaml:
    - k8s/namespace.yaml
    - k8s/kafka/kafka-metrics-cm.yaml
    - k8s/kafka/kafka-nodepool-controllers.yaml
    - k8s/kafka/kafka-nodepool-brokers.yaml
    - k8s/kafka/kafka-cluster.yaml
    - k8s/kafka/kafka-topics.yaml
    - k8s/kafka/kafka-topic-apicurio-registry-storage.yaml
    - k8s/kafka/kafka-connect-topics.yaml
    - k8s/postgres/postgres-secret.yaml
    - k8s/postgres/postgres.yaml
    - k8s/kafka-connect/kafka-connect.yaml
    - k8s/kafka-connect/kafka-connector-vehicle-completed-postgres.yaml
    - k8s/monitoring/prometheus-rbac.yaml
    - k8s/monitoring/prometheus-config.yaml
    - k8s/monitoring/prometheus.yaml
    - k8s/ksqldb/ksqldb.yaml
    - k8s/kafka-ui/kafka-ui.yaml
    - k8s/factory-app/deployment-producer.yaml
    - k8s/factory-app/service-producer-control.yaml
    - k8s/factory-app/rbac-dashboard-scaling.yaml
    - k8s/factory-app/deployment-dashboard.yaml
    - k8s/factory-app/service-dashboard.yaml
    - k8s/factory-app/deployment-delivered-cars.yaml
    - k8s/factory-app/service-delivered-cars.yaml
  helm:
    releases:
      - name: apicurio-registry
        chartPath: helm/apicurio-registry
        namespace: kafka-car-factory
        createNamespace: false
        wait: true

deploy:
  kubectl:
    defaultNamespace: kafka-car-factory

portForward:
  - resourceType: Service
    resourceName: factory-dashboard
    namespace: kafka-car-factory
    port: 3000
    localPort: 3000
  - resourceType: Service
    resourceName: factory-dashboard
    namespace: kafka-car-factory
    port: 3001
    localPort: 3001
  - resourceType: Service
    resourceName: kafka-ui
    namespace: kafka-car-factory
    port: 8080
    localPort: 8081
  - resourceType: Service
    resourceName: prometheus
    namespace: kafka-car-factory
    port: 9090
    localPort: 9090
  - resourceType: Service
    resourceName: ksqldb-server
    namespace: kafka-car-factory
    port: 8088
    localPort: 8088
  - resourceType: Service
    resourceName: postgres
    namespace: kafka-car-factory
    port: 5432
    localPort: 5433
  - resourceType: Service
    resourceName: factory-delivered-cars
    namespace: kafka-car-factory
    port: 8085
    localPort: 8085
  - resourceType: Service
    resourceName: apicurio-registry
    namespace: kafka-car-factory
    port: 8080
    localPort: 8080
